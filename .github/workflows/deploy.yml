name: NUL E-Learning Portal CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "18"
  APP_NAME: "nul-elearning-portal"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Run code quality checks
        run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build output verified successfully."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nul-elearning-portal-dist
          path: dist/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Confirm test completion
        run: echo "Automated test stage completed successfully."

    
 security:
    name: Security
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          extra_args: --only-verified

      - name: Install Pa11y
        run: npm install -g pa11y

      - name: Accessibility check
        run: |
          pa11y ./index.html --standard WCAG2AA --reporter cli || true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nul-elearning-portal-dist
          path: deployment-package/

      - name: Run pre-deployment checks
        run: |
          test -f deployment-package/index.html
          echo "Deployment package verified."
          echo "Application: ${{ env.APP_NAME }}"
          echo "Version: $(node -p "require('./package.json').version")"

      - name: Simulate staging deployment
        run: |
          echo "Transferring build artifact to staging environment..."
          echo "Restarting application service..."
          echo "Running post-deployment health check..."
          echo "Health check result: HTTP 200 OK"

      - name: Deployment summary
        run: |
          echo "NUL E-Learning Portal deployment completed."
          echo "Version: $(node -p "require('./package.json').version")"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Status: Staging deployment successful"
